<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Official Certificate</title><style>
@page{size:A4;margin:0}*{box-sizing:border-box}body{margin:0;background:#eef2f5;font-family:"Noto Sans Ethiopic",Arial,sans-serif;color:#16202a}.sheet{width:210mm;min-height:297mm;margin:20px auto;background:#fff;padding:18mm;border:1px solid #ccd5dc;position:relative;overflow:hidden}.border{position:absolute;inset:8mm;border:2px solid #173f5f;pointer-events:none}.inner{position:absolute;inset:11mm;border:1px solid #b9a46a;pointer-events:none}.content{position:relative;z-index:2;text-align:center;min-height:255mm;display:flex;flex-direction:column}.logo{width:82px;height:82px;object-fit:contain;margin:2mm auto 4mm}.city{font-size:20px;font-weight:800}.cityEn{font-size:13px;letter-spacing:.5px;margin-top:3px}.line{width:80%;height:2px;background:#b9a46a;margin:8mm auto}.title{font-size:28px;font-weight:900;margin:5mm 0}.subtitle{font-size:16px}.holder{font-size:25px;font-weight:800;margin:7mm 0 4mm}.body{font-size:15px;line-height:1.9;max-width:150mm;margin:0 auto}.meta{margin:9mm auto;display:grid;grid-template-columns:1fr 1fr;gap:5mm;width:150mm;text-align:left}.meta div{border-bottom:1px solid #d6dde3;padding:3mm}.qr{width:105px;height:105px;margin:5mm auto}.footer{margin-top:auto;display:flex;justify-content:space-between;text-align:center;padding:0 20mm 10mm}.sig{min-width:50mm;border-top:1px solid #333;padding-top:3mm}.stamp{width:55mm;height:25mm;border:2px dashed #777;display:flex;align-items:center;justify-content:center;font-size:11px;color:#777}.print{position:fixed;top:15px;right:15px;padding:10px 16px;border:0;border-radius:8px;background:#173f5f;color:#fff;cursor:pointer}@media print{body{background:#fff}.sheet{margin:0;border:0}.print{display:none}}.error{text-align:center;padding:30vh 10%;font-size:20px}
</style></head><body><button class="print" onclick="window.print()">🖨️ Print / Save PDF</button><main id="app"></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const code=new URLSearchParams(location.search).get('code')||'';const root=document.getElementById('app');if(!code){root.innerHTML='<div class="error">Verification code is required.</div>';return}try{const r=await fetch('/api/public/certificates/verify?code='+encodeURIComponent(code));const c=await r.json();if(!c.valid){root.innerHTML='<div class="error">ይህ ሰነድ ትክክለኛ የሆነ የማረጋገጫ ሰነድ አይደለም።<br><small>'+esc(c.error||c.status||'Invalid certificate')+'</small></div>';return}const q=await fetch('/api/public/certificates/qr?code='+encodeURIComponent(code)).then(x=>x.json());const settings=await fetch('/api/public/settings').then(x=>x.json());root.innerHTML=`<section class="sheet"><div class="border"></div><div class="inner"></div><div class="content"><img class="logo" src="/assets/logo.png" alt="Enewari City Administration"><div class="city">${esc(settings.certificate_org_name_am||settings.city_name_am||'')}</div><div class="cityEn">${esc(settings.certificate_org_name_en||settings.city_name_en||'')}</div><div class="line"></div><div class="title">${esc(c.title_am||'የማረጋገጫ ሰነድ')}</div><div class="subtitle">${esc(c.title_en||'OFFICIAL CERTIFICATE')}</div><div class="holder">${esc(c.holder_name)}</div><div class="body">ይህ ሰነድ ከላይ ለተጠቀሰው ባለመብት በእነዋሪ ከተማ አስተዳደር መሰጠቱን ያረጋግጣል።<br>This document is officially issued by Enewari City Administration.</div><div class="meta"><div><b>Certificate No.</b><br>${esc(c.certificate_no)}</div><div><b>Service</b><br>${esc(c.service_name_en||c.service_name_am||'—')}</div><div><b>Issued By</b><br>${esc(c.issued_by)}</div><div><b>Issued Date</b><br>${esc(c.issued_at)}</div><div><b>Expiry</b><br>${esc(c.expires_at||'No expiry')}</div><div><b>Verification Code</b><br>${esc(c.verification_code)}</div></div><img class="qr" src="${q.data||''}" alt="Verification QR"><div class="footer"><div class="sig">${esc(settings.certificate_signatory_am||'Authorized Signature')}<br><small>${esc(settings.certificate_title_am||'')}</small></div><div class="stamp">OFFICIAL STAMP / SEAL</div></div></div></section>`}catch(e){root.innerHTML='<div class="error">Certificate could not be loaded.</div>'}})();
</script></body></html>
