<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Verification — Enewari City Administration</title><link rel="stylesheet" href="/styles.css"></head><body><main class="container" style="max-width:820px;padding:60px 20px"><div class="panel"><span class="kicker">DIGITAL MESOB · VERIFICATION</span><h1>የሰነድ ማረጋገጫ</h1><p>የCertificate/Verification Code በመጠቀም የሰነዱን ትክክለኛነት ይፈትሹ።</p><form id="f" class="service-form"><input id="code" placeholder="Verification Code" required><button class="btn btn-primary">አረጋግጥ →</button></form><div id="result"></div></div></main><script>const q=new URLSearchParams(location.search).get('code');if(q)document.querySelector('#code').value=q;document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/public/certificates/verify?code='+encodeURIComponent(document.querySelector('#code').value));const d=await r.json();document.querySelector('#result').innerHTML=r.ok&&d.valid?`<div class="panel" style="margin-top:20px"><h2>✅ ሰነዱ ትክክለኛ ነው</h2><p><b>Certificate No:</b> ${d.certificate_no}</p><p><b>የተሰጠለት:</b> ${d.holder_name}</p><p><b>ሰነድ:</b> ${d.title_am} / ${d.title_en}</p><p><b>አገልግሎት:</b> ${d.service_name_am||'—'}</p><p><b>የሰጠው ተቋም:</b> ${d.issued_by}</p><p><b>የተሰጠበት:</b> ${new Date(d.issued_at).toLocaleString('am-ET')}</p></div>`:`<div class="panel" style="margin-top:20px"><h2>❌ ማረጋገጥ አልተቻለም</h2><p>${d.error||'ይህ ሰነድ አሁን ትክክለኛ አይደለም።'}</p></div>`};</script></body></html>
